<!-- Contact Section -->
<section id="contact" class="contact section">
    <div class="container" data-aos="fade-up" data-aos-delay="100">
        <div class="row">
            <!-- Left Column: Contact Information -->
            <div class="col-lg-6">
                <div class="row gy-4 contact-icons">
                    <div class="col-md-12">
                        <div class="info-item d-flex align-items-center" data-aos="fade-up" data-aos-delay="200">
                            <i class="icon bi bi-geo-alt flex-shrink-0"></i>
                            <div>
                                <h3>Address</h3>
                                <p>P.O BOX 00608, Nairobi Kenya</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="info-item d-flex align-items-center" data-aos="fade-up" data-aos-delay="300">
                            <i class="icon bi bi-telephone flex-shrink-0"></i>
                            <div>
                                <h3>Call Me</h3>
                                <p>+254 793595836</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="info-item d-flex align-items-center" data-aos="fade-up" data-aos-delay="400">
                            <i class="icon bi bi-envelope flex-shrink-0"></i>
                            <div>
                                <h3>Email Me</h3>
                                <p>mutheuw63@gmail.com</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="info-item d-flex align-items-center" data-aos="fade-up" data-aos-delay="500">
                            <i class="icon bi bi-share flex-shrink-0"></i>
                            <div>
                                <h3>Social Profiles</h3>
                                <div class="social-links">
                                    <a href="https://github.com/Arya-12234" target="_blank" rel="noopener noreferrer"><i class="bi bi-github"></i></a>
                                    <a href="https://www.linkedin.com/in/winnie-mutheu-477909210/" target="_blank" rel="noopener noreferrer"><i class="bi bi-linkedin"></i></a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End Left Column -->

            <!-- Right Column: Contact Form -->
            <div class="col-lg-6">
                <form action="{% url 'contact' %}" method="post" class="php-email-form" data-aos="fade-up" data-aos-delay="600">
                    {% csrf_token %}
                    <div class="row gy-4">
                        <div class="col-md-6">
                            <label for="contact-name">Your name</label>
                            <input id="contact-name" type="text" name="name" class="form-control" placeholder="Your Name" required maxlength="100" autocomplete="name" />
                        </div>

                        <div class="col-md-6">
                            <label for="contact-email">Your email</label>
                            <input id="contact-email" type="email" class="form-control" name="email" placeholder="Your Email" required maxlength="254" autocomplete="email" />
                        </div>

                        <div class="col-md-12">
                            <label for="contact-subject">Subject</label>
                            <input id="contact-subject" type="text" class="form-control" name="subject" placeholder="Subject" required maxlength="200" />
                        </div>

                        <div class="col-md-12">
                            <label for="contact-message">Message</label>
                            <textarea id="contact-message" class="form-control" name="message" rows="6" placeholder="Message" required maxlength="5000"></textarea>
                        </div>

                        <div class="col-md-12 text-center">
                            <div class="loading">Loading</div>
                            <div class="error-message"></div>
                            <div class="sent-message">Your message has been sent. Thank you!</div>
                            <button type="submit">Send Message</button>
                        </div>
                    </div>
                </form>
            </div>
            <!-- End Right Column -->
        </div>
    </div>
</section>
<!-- /Contact Section -->
<script>
document.querySelector('.php-email-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const form = e.target;
    const loading = form.querySelector('.loading');
    const error = form.querySelector('.error-message');
    const sent = form.querySelector('.sent-message');
    const tokenInput = form.querySelector('[name=csrfmiddlewaretoken]');

    loading.style.display = 'block';
    error.style.display = 'none';
    sent.style.display = 'none';

    fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': tokenInput ? tokenInput.value : getCookie('csrftoken')
        }
    })
    .then(async (response) => {
        let data = {};
        try {
            data = await response.json();
        } catch (parseError) {
            data = {};
        }
        if (!response.ok || data.status !== 'success') {
            error.textContent = data.message || 'Your message could not be sent. Please try again later.';
            error.style.display = 'block';
            return;
        }
        sent.style.display = 'block';
        form.reset();
    })
    .catch(() => {
        error.textContent = 'Your message could not be sent. Please try again later.';
        error.style.display = 'block';
    })
    .finally(() => {
        loading.style.display = 'none';
    });
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
